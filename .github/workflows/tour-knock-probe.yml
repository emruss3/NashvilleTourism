name: Temporary 445 Knock scheduler probe

on:
  push:
    branches:
      - ai/tour-scheduler-audit-20260908
    paths:
      - '.github/workflows/tour-knock-probe.yml'
      - 'scripts/tour-knock-probe.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: node scripts/tour-knock-probe.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tour-knock-probe
          path: tour-knock-output
          retention-days: 3
          if-no-files-found: warn
