name: Temporary Finery Direct Calendar Audit

on:
  push:
    branches:
      - temp-tour-audit-2026-09-04
    paths:
      - 'scripts/temp-finery-direct.mjs'
      - '.github/workflows/temp-finery-direct.yml'

permissions:
  contents: read

env:
  CI: true

jobs:
  finery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - run: node scripts/temp-finery-direct.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finery-direct-audit
          path: finery-direct-output
          if-no-files-found: warn
          retention-days: 1
