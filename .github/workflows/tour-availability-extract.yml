name: Tour availability date-level extract

on:
  push:
    branches:
      - audit/tour-availability-2026-09-04
    paths:
      - .github/workflows/tour-availability-extract.yml

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          mkdir -p /tmp/tour-extract && cd /tmp/tour-extract
          npm init -y >/dev/null
          npm install playwright@1.55.0 >/dev/null
          npx playwright install chromium
      - name: Extract slots
        working-directory: /tmp/tour-extract
        run: |
          cat > extract.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';

          const outDir = process.env.GITHUB_WORKSPACE + '/tour-extract-output';
          await fs.mkdir(outDir, { recursive: true });
          const browser = await chromium.launch({
            headless: true,
            args: ['--disable-dev-shm-usage','--disable-blink-features=AutomationControlled','--no-sandbox']
          });
          const dates = [
            {iso:'2026-09-11',md:'09/11/2026',long:'Friday, September 11, 2026',day:'11'},
            {iso:'2026-09-12',md:'09/12/2026',long:'Saturday, September 12, 2026',day:'12'},
            {iso:'2026-09-13',md:'09/13/2026',long:'Sunday, September 13, 2026',day:'13'},
            {iso:'2026-09-14',md:'09/14/2026',long:'Monday, September 14, 2026',day:'14'},
            {iso:'2026-09-15',md:'09/15/2026',long:'Tuesday, September 15, 2026',day:'15'},
            {iso:'2026-09-16',md:'09/16/2026',long:'Wednesday, September 16, 2026',day:'16'},
            {iso:'2026-09-17',md:'09/17/2026',long:'Thursday, September 17, 2026',day:'17'},
            {iso:'2026-09-18',md:'09/18/2026',long:'Friday, September 18, 2026',day:'18'}
          ];
          const baseContextOpts = {
            viewport:{width:1440,height:1000},
            locale:'en-US',
            timezoneId:'America/Chicago',
            userAgent:'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36'
          };
          const clean = s => (s || '').replace(/\s+/g,' ').trim();
          const short = (s,n=100000) => (s || '').slice(0,n);
          const apiRx = /appoint|avail|calendar|slot|schedule|tour|lead|widget/i;

          async function newContext() {
            const context = await browser.newContext(baseContextOpts);
            await context.addInitScript(() => Object.defineProperty(navigator,'webdriver',{get:()=>undefined}));
            return context;
          }

          async function funnelProperty(name, widgetUrl, expectedTypeCount) {
            const context = await newContext();
            const result = {name, platform:'Funnel/Nestio', widgetUrl, types:[], errors:[], network:[]};
            context.on('response', async res => {
              try {
                if (!apiRx.test(res.url())) return;
                const ct=(res.headers()['content-type']||'').toLowerCase();
                let body='';
                if(ct.includes('json')||ct.includes('text')||ct.includes('javascript')) body=short(await res.text().catch(()=>''),150000);
                result.network.push({status:res.status(),method:res.request().method(),url:res.url(),post:short(res.request().postData()||'',30000),body});
              } catch {}
            });
            try {
              // Capture scheduler JS so API routes can be inspected if UI automation hits a widget regression.
              const scriptPage = await context.newPage();
              await scriptPage.goto(widgetUrl,{waitUntil:'domcontentloaded',timeout:60000});
              await scriptPage.waitForTimeout(4000);
              result.initialBody = clean(await scriptPage.locator('body').innerText().catch(()=>''));
              result.initialHtml = short(await scriptPage.content().catch(()=>''),250000);
              result.scriptBodies = await scriptPage.evaluate(async () => {
                const urls=[...document.scripts].map(s=>s.src).filter(Boolean).filter(u=>u.includes('/contact-widget/v1/'));
                const out=[];
                for(const u of [...new Set(urls)]){
                  try{const r=await fetch(u);out.push({url:u,status:r.status,body:(await r.text()).slice(0,800000)});}catch(e){out.push({url:u,error:String(e)});}
                }
                return out;
              }).catch(()=>[]);
              await scriptPage.close();

              for (let typeIndex=0; typeIndex<expectedTypeCount; typeIndex++) {
                const typeResult={index:typeIndex,label:null,hiddenValue:null,menuTexts:[],days:{},errors:[]};
                for (const d of dates) {
                  const page=await context.newPage();
                  try {
                    await page.goto(widgetUrl,{waitUntil:'domcontentloaded',timeout:60000});
                    await page.waitForTimeout(2500);
                    const typeButton=page.locator('.cheryl__select-tour-type [role="button"]').first();
                    await typeButton.click({timeout:10000});
                    await page.waitForTimeout(300);
                    if (!typeResult.menuTexts.length) {
                      typeResult.menuTexts = await page.locator('[role="option"], [role="listbox"] li, [class*="SingleSelectOption"], [class*="SelectOption"]').evaluateAll(els => els.filter(e=>{
                        const s=getComputedStyle(e);return s.display!=='none'&&s.visibility!=='hidden';
                      }).map(e=>(e.innerText||e.textContent||'').replace(/\s+/g,' ').trim()).filter(Boolean));
                      if(!typeResult.menuTexts.length){
                        typeResult.openMenuHtml=short(await page.content(),250000);
                      }
                    }
                    // Keyboard selection works across Funnel's custom single-select implementation.
                    for(let i=0;i<=typeIndex;i++) await page.keyboard.press('ArrowDown');
                    await page.keyboard.press('Enter');
                    await page.waitForTimeout(1200);
                    typeResult.label = clean(await typeButton.innerText().catch(()=>''));
                    typeResult.hiddenValue = await page.locator('.cheryl__select-tour-type input[type="hidden"]').inputValue().catch(()=>null);

                    const dateInput=page.locator('.cheryl__select-date input[type="text"]').first();
                    await dateInput.click({timeout:10000});
                    await page.waitForTimeout(350);
                    const dayCells=page.locator('.react-datepicker__day:not(.react-datepicker__day--outside-month)');
                    const count=await dayCells.count();
                    let picked=false;
                    for(let i=0;i<count;i++){
                      const cell=dayCells.nth(i);
                      if(clean(await cell.innerText().catch(()=>''))!==d.day) continue;
                      const cls=await cell.getAttribute('class')||'';
                      const disabled=(await cell.getAttribute('aria-disabled'))==='true'||/disabled/.test(cls);
                      typeResult.days[d.iso]={dateCellClass:cls,dateCellAria:await cell.getAttribute('aria-label'),dateDisabled:disabled,times:[]};
                      if(!disabled){await cell.click();picked=true;}
                      break;
                    }
                    if(!typeResult.days[d.iso]) typeResult.days[d.iso]={dateCellMissing:true,times:[]};
                    if(picked){
                      await page.waitForTimeout(1800);
                      const timeButton=page.locator('.cheryl__select-time [role="button"]').first();
                      const tcls=await timeButton.getAttribute('class')||'';
                      typeResult.days[d.iso].timeButtonClass=tcls;
                      if(!/disabled/.test(tcls)){
                        await timeButton.click();
                        await page.waitForTimeout(400);
                        const selectors='[role="option"], [role="listbox"] li, [class*="SingleSelectOption"], [class*="SelectOption"]';
                        const vals=await page.locator(selectors).evaluateAll(els => els.filter(e=>{
                          const s=getComputedStyle(e);return s.display!=='none'&&s.visibility!=='hidden';
                        }).map(e=>(e.innerText||e.textContent||'').replace(/\s+/g,' ').trim()).filter(Boolean));
                        typeResult.days[d.iso].times=[...new Set(vals)].filter(x=>/\d/.test(x));
                        typeResult.days[d.iso].menuAll=[...new Set(vals)];
                        if(!typeResult.days[d.iso].times.length) typeResult.days[d.iso].debugHtml=short(await page.content(),200000);
                      }
                    }
                  } catch(e) {
                    typeResult.errors.push({date:d.iso,error:String(e?.stack||e)});
                    typeResult.days[d.iso] ||= {times:[]};
                    typeResult.days[d.iso].error=String(e);
                  }
                  await page.close();
                }
                result.types.push(typeResult);
              }
            } catch(e){result.errors.push(String(e?.stack||e));}
            await fs.writeFile(`${outDir}/${name.toLowerCase().replace(/[^a-z0-9]+/g,'-')}.json`,JSON.stringify(result,null,2));
            console.log('FUNNEL_RESULT',JSON.stringify(result));
            await context.close();
          }

          async function rentCafeDirect(name,url) {
            const context=await newContext();
            const page=await context.newPage();
            const result={name,platform:'RentCafe direct',url,days:{},errors:[],network:[]};
            page.on('response',async res=>{
              try{if(!/GetAvailableSlots|GetWeeklyCalendar|scheduletour/i.test(res.url()))return;result.network.push({status:res.status(),method:res.request().method(),url:res.url(),post:res.request().postData()||'',body:short(await res.text().catch(()=>''),200000)});}catch{}
            });
            try{
              await page.goto(url,{waitUntil:'domcontentloaded',timeout:75000});
              await page.waitForTimeout(5000);
              result.title=await page.title();result.body=short(await page.locator('body').innerText().catch(()=>''),30000);
              if(/security verification|just a moment/i.test(result.body)) throw new Error('Cloudflare verification page');
              result.tourText=clean(await page.locator('body').innerText().catch(()=>''));
              const fetched=await page.evaluate(async (dates) => {
                const token=document.querySelector('#scheduletour-request-verification-token')?.value;
                if(!token) return {error:'missing verification token'};
                const out={};
                for(const d of dates){
                  let best=null;
                  for(const dt of [d.md,d.long]){
                    const body=new URLSearchParams({dtSchedule:dt,tourType:'0',txtBedroom:'',units:''}).toString();
                    const r=await fetch(location.pathname+'?handler=GetAvailableSlots',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded','RequestVerificationToken':token,'Cache-Control':'no-cache'},body});
                    const text=await r.text();
                    const div=document.createElement('div');div.innerHTML=text;
                    const times=[...div.querySelectorAll('.availableslots_button')].map(e=>(e.innerText||e.textContent||'').replace(/\s+/g,' ').trim()).filter(Boolean);
                    const candidate={status:r.status,input:dt,times:[...new Set(times)],text:(div.innerText||'').replace(/\s+/g,' ').trim(),html:text.slice(0,100000)};
                    if(!best||candidate.times.length>best.times.length)best=candidate;
                    if(candidate.times.length)break;
                  }
                  out[d.iso]=best;
                }
                return out;
              },dates);
              if(fetched?.error) throw new Error(fetched.error);
              result.days=fetched;
            }catch(e){result.errors.push(String(e?.stack||e));}
            await fs.writeFile(`${outDir}/${name.toLowerCase().replace(/[^a-z0-9]+/g,'-')}.json`,JSON.stringify(result,null,2));
            console.log('RENTCAFE_DIRECT_RESULT',JSON.stringify(result));
            await context.close();
          }

          async function inspectPage(name,url,clickPatterns=[]) {
            const context=await newContext();
            let page=await context.newPage();
            const result={name,url,errors:[],pages:[],network:[]};
            context.on('response',async res=>{try{if(!apiRx.test(res.url()))return;const ct=(res.headers()['content-type']||'').toLowerCase();let body='';if(ct.includes('json')||ct.includes('text')||ct.includes('javascript'))body=short(await res.text().catch(()=>''),150000);result.network.push({status:res.status(),method:res.request().method(),url:res.url(),post:res.request().postData()||'',body});}catch{}});
            try{
              await page.goto(url,{waitUntil:'domcontentloaded',timeout:75000});await page.waitForTimeout(7000);
              for(const pat of clickPatterns){
                const candidates=page.locator('a,button,[role="button"]').filter({hasText:pat});
                const n=Math.min(await candidates.count(),10);let done=false;
                for(let i=0;i<n&&!done;i++){
                  const e=candidates.nth(i);if(!await e.isVisible().catch(()=>false))continue;
                  const pop=context.waitForEvent('page',{timeout:3000}).catch(()=>null);
                  await e.click({timeout:5000}).catch(()=>{});const p=await pop;if(p){page=p;await p.waitForLoadState('domcontentloaded',{timeout:30000}).catch(()=>{});}await page.waitForTimeout(5000);done=true;
                }
                if(done)break;
              }
              for(const p of context.pages()){
                const snap={url:p.url(),title:await p.title().catch(()=>''),body:short(await p.locator('body').innerText().catch(()=>''),100000),html:short(await p.content().catch(()=>''),500000),frames:[]};
                snap.controls=await p.locator('a,button,input,select,option,[role="button"],[role="radio"],[role="option"]').evaluateAll(els=>els.map(e=>({tag:e.tagName,text:(e.innerText||e.value||e.getAttribute('aria-label')||e.getAttribute('placeholder')||'').replace(/\s+/g,' ').trim(),href:e.href||'',id:e.id||'',name:e.name||'',cls:typeof e.className==='string'?e.className:'',disabled:!!e.disabled,aria:e.getAttribute('aria-label')||''})).filter(x=>/tour|schedule|date|time|book|appoint|sep|11|12|13|14|15|16|17|18/i.test(JSON.stringify(x))).slice(0,3000));
                for(const f of p.frames())snap.frames.push({url:f.url(),body:short(await f.locator('body').innerText().catch(()=>''),100000),html:short(await f.content().catch(()=>''),500000)});
                result.pages.push(snap);
              }
            }catch(e){result.errors.push(String(e?.stack||e));}
            await fs.writeFile(`${outDir}/${name.toLowerCase().replace(/[^a-z0-9]+/g,'-')}.json`,JSON.stringify(result,null,2));
            console.log('INSPECT_RESULT',JSON.stringify({name,errors:result.errors,pages:result.pages.map(p=>({url:p.url,title:p.title,body:p.body.slice(0,15000),controls:p.controls.slice(0,500),frames:p.frames.map(f=>({url:f.url,body:f.body.slice(0,12000)}))})),network:result.network.slice(0,200)}));
            await context.close();
          }

          await Promise.all([
            funnelProperty('Emblem Park','https://integrations.nestio.com/contact-widget/v1/iframe-widget.html?type=lead_capture_appointment&key=03f5fe3982bf41a380739512238020a1&group=10676&color=00414B',1),
            funnelProperty('Westerly House','https://integrations.nestio.com/contact-widget/v1/iframe-widget.html?type=lead_capture_appointment&key=03f5fe3982bf41a380739512238020a1&group=8221&color=736b74',2),
            funnelProperty('Queens Wedgewood Houston','https://integrations.nestio.com/contact-widget/v1/iframe-widget.html?type=lead_capture_appointment&key=03f5fe3982bf41a380739512238020a1&group=6311&color=385440',2),
            rentCafeDirect('Memoir May Hosiery','https://www.memoir-mayhosiery.com/scheduletour'),
            rentCafeDirect('Memoir Wedgewood Houston Direct','https://www.memoir-wedgewoodhouston.com/scheduletour'),
            inspectPage('Memoir Wedgewood Houston RentCafe','https://www.rentcafe.com/apartments/tn/nashville/memoir-wedgewood-houston/default.aspx',[/schedule a tour/i,/book tour/i]),
            inspectPage('Standard Assembly Current Site','https://thestandardassembly.com/schedule-a-tour/',[/book a tour/i,/schedule a tour/i]),
            inspectPage('Standard Assembly Home','https://thestandardassembly.com/',[/book a tour/i,/schedule a tour/i])
          ]);
          await browser.close();
          JS
          node extract.mjs
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tour-availability-date-level-extract
          path: tour-extract-output
          retention-days: 7
