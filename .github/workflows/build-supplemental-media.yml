name: Build licensed Nashville supplemental media

on:
  pull_request:
    branches:
      - media/workflow-base
    paths:
      - 'scripts/download_supplemental_nashville_media.py'
      - 'scripts/download_supplemental_nashville_media_v2.py'
      - '.github/workflows/build-supplemental-media.yml'
      - '.supplemental-media-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-supplemental-media:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests pillow

      - name: Download and optimize licensed media
        run: python scripts/download_supplemental_nashville_media_v2.py

      - name: Print manifest
        if: always()
        run: |
          cat nashville-supplemental-media/README.md || true
          du -sh nashville-supplemental-media || true

      - name: Upload supplemental media
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nashville-supplemental-media
          path: nashville-supplemental-media/
          if-no-files-found: error
          compression-level: 6
          retention-days: 7
