name: Temporary multi-provider tour browser

on:
  push:
    branches:
      - ai/tour-scheduler-audit-20260908
    paths:
      - '.github/workflows/tour-provider-browser.yml'
      - 'scripts/tour-provider-browser.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: node scripts/tour-provider-browser.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tour-provider-browser
          path: tour-provider-browser-output
          retention-days: 3
          if-no-files-found: warn
