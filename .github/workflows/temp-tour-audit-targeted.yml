name: Temporary Provider-Specific Tour Audit

on:
  push:
    branches:
      - temp-tour-audit-2026-09-04
    paths:
      - 'scripts/temp-tour-audit-targeted.mjs'
      - '.github/workflows/temp-tour-audit-targeted.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run provider-specific audit
        run: node scripts/temp-tour-audit-targeted.mjs
      - name: Upload provider-specific evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tour-audit-targeted
          path: targeted-audit-output
          if-no-files-found: warn
          retention-days: 1
