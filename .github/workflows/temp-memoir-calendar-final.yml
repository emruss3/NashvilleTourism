name: Temporary final Memoir target-date audit

on:
  push:
    branches:
      - temp-tour-audit-2026-09-04
    paths:
      - 'scripts/temp-memoir-calendar-final.mjs'
      - '.github/workflows/temp-memoir-calendar-final.yml'

permissions:
  contents: read

env:
  CI: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - run: node scripts/temp-memoir-calendar-final.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memoir-calendar-final
          path: memoir-calendar-final-output
          if-no-files-found: warn
          retention-days: 1
