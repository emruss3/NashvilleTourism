name: Temporary Standard and Finery inventory

on:
  push:
    branches:
      - ai/tour-scheduler-audit-20260908
    paths:
      - '.github/workflows/tour-standard-finery-probe.yml'
      - 'scripts/tour-standard-finery-probe.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/tour-standard-finery-probe.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tour-standard-finery
          path: tour-standard-finery-output
          retention-days: 3
