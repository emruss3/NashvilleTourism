name: Temporary live tour scheduler audit

on:
  push:
    branches:
      - tmp-tour-audit-links
    paths:
      - .github/workflows/tour-audit.yml
      - scripts/tour-audit-inspect.mjs

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out temporary branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser runtime
        shell: bash
        run: |
          mkdir -p /tmp/tour-audit-run
          cp scripts/tour-audit-inspect.mjs /tmp/tour-audit-run/audit.mjs
          cd /tmp/tour-audit-run
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run live browser inspection
        shell: bash
        run: node /tmp/tour-audit-run/audit.mjs

      - name: Upload inspection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tour-audit-output
          path: tour-audit-output
          retention-days: 1
          if-no-files-found: warn

      - name: Save text results to temporary branch
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f tour-audit-output/inspection.json tour-audit-output/README.txt
          git commit -m "Temporary live tour scheduler inspection results" || exit 0
          git push origin HEAD:tmp-tour-audit-links
