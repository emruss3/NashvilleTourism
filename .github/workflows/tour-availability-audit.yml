name: Temporary tour availability audit

on:
  push:
    branches:
      - audit/tour-availability-2026-09-08
    paths:
      - '.github/scripts/tour-audit-recon.mjs'
      - '.github/workflows/tour-availability-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out temporary audit branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install --no-save --ignore-scripts playwright
          npx playwright install --with-deps chromium

      - name: Audit live tour schedulers
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/tour-audit-recon.mjs')
          s = p.read_text()
          old = ".catch(()=>[]));\n  return{label"
          new = ".catch(()=>[])});\n  return{label"
          if old not in s:
              raise SystemExit('Expected syntax-fix target not found')
          p.write_text(s.replace(old, new, 1))
          PY
          node --check .github/scripts/tour-audit-recon.mjs
          node .github/scripts/tour-audit-recon.mjs
        env:
          AUDIT_OUT: tour-audit-artifacts

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tour-audit-recon
          path: tour-audit-artifacts
          if-no-files-found: warn
          retention-days: 2
