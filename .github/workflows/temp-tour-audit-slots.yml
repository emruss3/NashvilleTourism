name: Temporary Tour Slot Audit

on:
  push:
    branches:
      - temp-tour-audit-2026-09-04
    paths:
      - 'scripts/temp-tour-audit-slots.mjs'
      - '.github/workflows/temp-tour-audit-slots.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true

jobs:
  slots:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Run slot-level live browser audit
        run: node scripts/temp-tour-audit-slots.mjs

      - name: Upload slot audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tour-audit-slots
          path: slot-audit-output
          if-no-files-found: warn
          retention-days: 1
