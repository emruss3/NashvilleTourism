name: Last-mile tour availability audit

on:
  push:
    branches:
      - ai/tour-scheduler-audit-20260908
    paths:
      - '.github/workflows/tour-last-mile-audit.yml'
      - 'scripts/tour-last-mile-audit.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run last-mile browser audit
        run: node scripts/tour-last-mile-audit.mjs
      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tour-last-mile-output
          path: tour-last-mile-output
          retention-days: 3
          if-no-files-found: warn
